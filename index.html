<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Add and remove Example objects in a RERUM collection through TinyNode.">
  <title>thehabes playground example</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://devstore.rerum.io" crossorigin>
  <link rel="preconnect" href="https://tinydev.rerum.io" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>

<body>
  <header class="site-header">
    <h1>thehabes playground example</h1>
    <p>
      Add Example objects to a <a id="collection-link" href="#" target="_blank" rel="noreferrer">RERUM collection</a>,
      or remove them from it. Removed Examples are deleted.
    </p>
  </header>

  <main class="playground">
    <section class="collection" aria-labelledby="collection-heading">
      <div class="collection-toolbar">
        <h2 id="collection-heading">Collection</h2>
        <p id="item-count" class="collection-count">Loading…</p>
        <button type="button" id="add-example" class="button button-primary" disabled>Add Example</button>
      </div>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <p id="empty-message" class="empty-message" hidden>The collection is empty.</p>
      <ul id="example-list" class="example-list"></ul>
    </section>
  </main>
</body>

</html>
